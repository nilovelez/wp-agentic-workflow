<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
	WordPress.org icon, designed at 256x256 (render-assets.mjs also makes the
	128x128 version). Until it is designed, it works as a placeholder: replace
	the initials. To use an image instead, put it next to this file and show
	it with an <img> filling the page.
-->
<style>
	html, body {
		margin: 0;
		width: 256px;
		height: 256px;
		overflow: hidden;
	}

	.icon {
		width: 256px;
		height: 256px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #2271b1;
		color: #fff;
		font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
		font-size: 112px;
		font-weight: 800;
	}
</style>
</head>
<body>
	<div class="icon">PN</div>
</body>
</html>
