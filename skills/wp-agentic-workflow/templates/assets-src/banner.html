<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
	WordPress.org banner, designed at 1544x500 (render-assets.mjs also makes
	the 772x250 version). Until it is designed, it works as a placeholder:
	replace the plugin name and the tagline.
-->
<style>
	html, body {
		margin: 0;
		width: 1544px;
		height: 500px;
		overflow: hidden;
	}

	.banner {
		box-sizing: border-box;
		width: 1544px;
		height: 500px;
		padding: 0 120px;
		display: flex;
		flex-direction: column;
		justify-content: center;
		background: linear-gradient( 120deg, #f0f6fc 0%, #c5d9ed 100% );
		color: #1d2327;
		font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	}

	.title {
		margin: 0;
		font-size: 104px;
		font-weight: 800;
		line-height: 1;
	}

	.tagline {
		margin: 32px 0 0;
		font-size: 40px;
		font-weight: 600;
		color: #2c3338;
	}
</style>
</head>
<body>
	<div class="banner">
		<h1 class="title">Plugin Name</h1>
		<p class="tagline">One line about what the plugin does.</p>
	</div>
</body>
</html>
